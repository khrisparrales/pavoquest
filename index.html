<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PavoQuest - Tracker Diario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,0.2) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(339,49%,30%,0.2) 0, transparent 50%); min-height: 100vh; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .vbuck-color { color: #38bdf8; } .vbuck-bg { background-color: #0284c7; } .vbuck-bg:hover { background-color: #0369a1; }
        .habit-checkbox:checked + div { background-color: #0284c7; border-color: #0284c7; }
        .habit-checkbox:checked + div svg { opacity: 1; }
        circle { transition: stroke-dashoffset 1s linear, stroke 0.5s ease; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8 relative">

    <div id="login-overlay" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-[200] hidden">
        <div class="bg-slate-800 p-8 rounded-3xl max-w-md w-full mx-4 border border-slate-700 shadow-2xl text-center">
            <i data-lucide="gem" class="w-16 h-16 vbuck-color mx-auto mb-4"></i>
            <h2 class="text-3xl font-extrabold tracking-tight mb-2 text-white">Pavo<span class="vbuck-color">Quest</span></h2>
            <div class="space-y-4 mb-6 text-left">
                <input type="email" id="login-email" placeholder="Correo" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-white">
                <input type="password" id="login-password" placeholder="Contraseña" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-white">
            </div>
            <div class="flex flex-col gap-3">
                <button onclick="window.handleLogin()" class="w-full vbuck-bg hover:bg-sky-700 text-white py-3 rounded-xl font-bold transition">Iniciar Sesión</button>
                <button onclick="window.handleRegister()" class="w-full bg-slate-700 hover:bg-slate-600 text-white py-3 rounded-xl font-bold transition">Crear Cuenta</button>
            </div>
        </div>
    </div>

    <div id="app-container" class="max-w-7xl mx-auto hidden">
        <header class="flex items-center justify-between mb-8 pb-4 border-b border-slate-700">
            <div class="flex items-center gap-3"><i data-lucide="gem" class="w-8 h-8 vbuck-color"></i><h1 class="text-3xl font-extrabold tracking-tight">Pavo<span class="vbuck-color">Quest</span></h1></div>
            <button onclick="window.logout()" class="text-slate-400 hover:text-red-400 text-sm font-semibold transition-colors">Cerrar Sesión</button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-4 flex flex-col gap-6">
                <div class="glass-card rounded-3xl p-8">
                    <h2 class="text-lg font-semibold mb-2 flex items-center gap-2 text-slate-300"><i data-lucide="wallet" class="w-5 h-5"></i> Mis Pavos</h2>
                    <div id="balance-display" class="flex items-end gap-3 mt-4">
                        <span id="current-balance" class="text-6xl font-black vbuck-color">0</span>
                        <button onclick="window.editBalanceMode(true)" class="p-2 hover:bg-slate-700/50 rounded-xl transition-colors mb-2 text-slate-400"><i data-lucide="pencil" class="w-5 h-5"></i></button>
                    </div>
                    <div id="balance-edit-form" class="mt-4 hidden flex gap-2">
                        <input type="number" id="input-balance" class="bg-slate-900/80 border border-slate-600 rounded-xl px-4 py-3 w-full font-bold text-lg">
                        <button onclick="window.saveBalance()" class="vbuck-bg px-6 rounded-xl font-bold">OK</button>
                    </div>
                    <button onclick="window.add100Vbucks()" class="mt-8 w-full bg-slate-800 hover:bg-slate-700 py-4 rounded-xl font-bold border border-slate-600 flex items-center justify-center gap-2">
                        <i data-lucide="plus-circle" class="w-5 h-5 text-sky-400"></i> Reclamé 100 Pavos
                    </button>
                </div>

                <div class="glass-card rounded-3xl p-6 text-center border border-sky-500/30">
                    <h2 class="text-xs font-black text-sky-400 mb-6 uppercase tracking-[0.2em]">Siguiente Recompensa</h2>
                    <div id="timer" class="grid grid-cols-4 gap-3">
                        <div class="flex flex-col items-center"><span id="timer-days" class="text-2xl font-black">00</span><span class="text-[10px] text-slate-500 mt-1">DÍAS</span></div>
                        <div class="flex flex-col items-center"><span id="timer-hours" class="text-2xl font-black">00</span><span class="text-[10px] text-slate-500 mt-1">HRS</span></div>
                        <div class="flex flex-col items-center"><span id="timer-mins" class="text-2xl font-black">00</span><span class="text-[10px] text-slate-500 mt-1">MIN</span></div>
                        <div class="flex flex-col items-center"><span id="timer-secs" class="text-2xl font-black text-sky-400">00</span><span class="text-[10px] font-bold text-sky-600 mt-1">SEG</span></div>
                    </div>
                </div>

                <div class="glass-card rounded-3xl p-6">
                    <div class="flex justify-between items-center mb-6"><h2 class="font-bold text-lg text-slate-200">Hábitos</h2><button onclick="document.getElementById('modal-add-habit').classList.remove('hidden')" class="text-xs text-sky-400 font-bold">+ Añadir</button></div>
                    <div id="habits-list" class="space-y-3"></div>
                </div>
            </div>

            <div class="lg:col-span-8 flex flex-col gap-6">
                <div class="glass-card rounded-3xl p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h2 id="calendar-month-year" class="font-bold text-xl text-slate-200 capitalize">Mes</h2>
                        <div class="flex gap-2"><button onclick="window.changeMonth(-1)" class="p-2 bg-slate-800 rounded-lg"><i data-lucide="chevron-left" class="w-5 h-5"></i></button><button onclick="window.changeMonth(1)" class="p-2 bg-slate-800 rounded-lg"><i data-lucide="chevron-right" class="w-5 h-5"></i></button></div>
                    </div>
                    <div id="calendar-grid" class="grid grid-cols-7 gap-3 text-center"></div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="glass-card rounded-3xl p-6 flex flex-col">
                        <div class="flex justify-between items-center mb-6"><h2 class="font-bold text-lg text-slate-200">En Tienda</h2><button onclick="document.getElementById('modal-add-store').classList.remove('hidden')" class="text-xs text-sky-400 font-bold">+ Objeto</button></div>
                        <div id="store-list" class="space-y-3 flex-1 overflow-y-auto pr-2 custom-scrollbar"></div>
                    </div>
                    <div class="glass-card rounded-3xl p-6 flex flex-col">
                        <div class="flex justify-between items-center mb-6"><h2 class="font-bold text-lg text-slate-200">Mis Metas</h2><button onclick="window.openGoalModal()" class="text-xs text-sky-400 font-bold">+ Nueva</button></div>
                        <div id="goals-list" class="space-y-4 flex-1 overflow-y-auto pr-2 custom-scrollbar"></div>
                    </div>
                </div>

                <div class="glass-card rounded-3xl p-6">
                    <h2 class="font-bold text-lg mb-6 flex items-center gap-2 text-slate-200"><i data-lucide="users" class="w-5 h-5 text-sky-400"></i> Ranking</h2>
                    <div id="friends-list" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modales -->
    <div id="modal-add-habit" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center z-50 hidden p-4"><div class="bg-slate-800 p-8 rounded-3xl w-full max-w-sm border border-slate-700"><h3 class="font-bold mb-4">Nuevo Hábito</h3><input type="text" id="input-habit-name" placeholder="Nombre" class="w-full bg-slate-900 p-3 rounded-xl mb-3"><input type="text" id="input-habit-emoji" placeholder="Emoji" class="w-full bg-slate-900 p-3 rounded-xl mb-6"><div class="flex justify-end gap-3"><button onclick="window.closeModal('modal-add-habit')" class="px-4 py-2">Cancelar</button><button onclick="window.saveNewHabit()" class="vbuck-bg px-6 py-2 rounded-xl">Guardar</button></div></div></div>
    <div id="modal-add-goal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center z-50 hidden p-4"><div class="bg-slate-800 p-8 rounded-3xl w-full max-w-sm border border-slate-700"><h3 class="font-bold mb-4">Nueva Meta</h3><input type="text" id="input-goal-name" placeholder="Nombre" class="w-full bg-slate-900 p-3 rounded-xl mb-3"><input type="number" id="input-goal-amount" placeholder="Costo" class="w-full bg-slate-900 p-3 rounded-xl mb-6"><div class="flex justify-end gap-3"><button onclick="window.closeModal('modal-add-goal')" class="px-4 py-2">Cancelar</button><button onclick="window.saveNewGoal()" class="vbuck-bg px-6 py-2 rounded-xl">Guardar</button></div></div></div>
    <div id="modal-add-store" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center z-50 hidden p-4"><div class="bg-slate-800 p-8 rounded-3xl w-full max-w-sm border border-slate-700"><h3 class="font-bold mb-4">Nueva Skin/Objeto</h3><input type="text" id="input-store-name" placeholder="Nombre" class="w-full bg-slate-900 p-3 rounded-xl mb-3"><input type="date" id="input-store-date" class="w-full bg-slate-900 p-3 rounded-xl mb-6"><div class="flex justify-end gap-3"><button onclick="window.closeModal('modal-add-store')" class="px-4 py-2">Cancelar</button><button onclick="window.saveNewStore()" class="vbuck-bg px-6 py-2 rounded-xl">Guardar</button></div></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, onSnapshot, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyC9vNJDaIfrG5BiJfYP50qr-TF-uD6qqGo", authDomain: "pavoquest.firebaseapp.com", projectId: "pavoquest", storageBucket: "pavoquest.firebasestorage.app", messagingSenderId: "1083886516982", appId: "1:1083886516982:web:88bc85595b2370579e8ad7" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'default-app-id';

        let currentUserId = null, currentBalance = 0, currentCalendarDate = new Date(), habitsData = [], goalsData = [], storeData = [];

        onAuthStateChanged(auth, (user) => {
            if(user) {
                currentUserId = user.uid;
                document.getElementById('app-container').classList.remove('hidden');
                document.getElementById('login-overlay').classList.add('hidden');
                
                onSnapshot(doc(db, 'artifacts', appId, 'users', currentUserId, 'profile', 'data'), (snap) => {
                    currentBalance = snap.exists() ? snap.data().balance : 0;
                    document.getElementById('current-balance').textContent = currentBalance.toLocaleString();
                    setDoc(doc(db, 'artifacts', appId, 'public_profiles', currentUserId), { email: user.email, balance: currentBalance }, { merge: true });
                    renderCalendar(); renderGoals();
                });
                
                onSnapshot(collection(db, 'artifacts', appId, 'users', currentUserId, 'goals'), (snap) => {
                    goalsData = []; snap.forEach(d => goalsData.push({id: d.id, ...d.data()}));
                    renderGoals();
                });
                
                onSnapshot(collection(db, 'artifacts', appId, 'users', currentUserId, 'storeItems'), (snap) => {
                    storeData = []; snap.forEach(d => storeData.push({id: d.id, ...d.data()}));
                    renderStore();
                });
                
                onSnapshot(doc(db, 'artifacts', appId, 'users', currentUserId, 'habits', 'data'), (snap) => {
                    habitsData = snap.exists() ? (snap.data().list || []) : [];
                    renderHabits();
                });

                onSnapshot(collection(db, 'artifacts', appId, 'public_profiles'), (snap) => {
                    const list = document.getElementById('friends-list'); list.innerHTML = '';
                    const ps = []; snap.forEach(d => ps.push({id: d.id, ...d.data()}));
                    ps.sort((a,b) => b.balance - a.balance);
                    ps.forEach((p, i) => {
                        let c = i === 0 ? 'text-yellow-400' : i === 1 ? 'text-slate-300' : i === 2 ? 'text-amber-700' : 'text-slate-600';
                        list.innerHTML += `<div class="bg-slate-800/40 p-3 rounded-2xl flex justify-between items-center border border-slate-700"><div class="flex items-center gap-2"><i data-lucide="trophy" class="w-4 h-4 ${c}"></i>${p.email.split('@')[0]}</div><span class="vbuck-color font-black">${p.balance}</span></div>`;
                    });
                    lucide.createIcons();
                });
            } else {
                document.getElementById('app-container').classList.add('hidden');
                document.getElementById('login-overlay').classList.remove('hidden');
            }
        });

        window.editBalanceMode = (show) => { document.getElementById('balance-display').classList.toggle('hidden', show); document.getElementById('balance-edit-form').classList.toggle('hidden', !show); if(show) document.getElementById('input-balance').value = currentBalance; };
        window.saveBalance = async () => { await setDoc(doc(db, 'artifacts', appId, 'users', currentUserId, 'profile', 'data'), { balance: parseInt(document.getElementById('input-balance').value) || 0 }, { merge: true }); window.editBalanceMode(false); };
        window.add100Vbucks = () => { if(currentUserId) setDoc(doc(db, 'artifacts', appId, 'users', currentUserId, 'profile', 'data'), { balance: currentBalance + 100 }, { merge: true }); };
        
        window.saveNewGoal = async () => { const name = document.getElementById('input-goal-name').value; const amount = parseInt(document.getElementById('input-goal-amount').value); if(name && amount) { await addDoc(collection(db, 'artifacts', appId, 'users', currentUserId, 'goals'), { name, targetAmount: amount }); window.closeModal('modal-add-goal'); } };
        window.claimGoal = async (id, amount) => { if(currentBalance >= amount) { await setDoc(doc(db, 'artifacts', appId, 'users', currentUserId, 'profile', 'data'), { balance: currentBalance - amount }, { merge: true }); await deleteDoc(doc(db, 'artifacts', appId, 'users', currentUserId, 'goals', id)); } };
        window.deleteGoal = async (id) => { await deleteDoc(doc(db, 'artifacts', appId, 'users', currentUserId, 'goals', id)); };
        window.deleteStoreItem = async (id) => { await deleteDoc(doc(db, 'artifacts', appId, 'users', currentUserId, 'storeItems', id)); };
        
        window.renderGoals = () => { 
            document.getElementById('goals-list').innerHTML = goalsData.map(g => { 
                const p = Math.min(100, Math.floor((currentBalance / g.targetAmount) * 100));
                return `<div class="bg-slate-800/40 p-4 rounded-2xl border border-slate-700 flex flex-col gap-2">
                    <div class="flex justify-between items-center"><span class="font-bold text-sm">${g.name}</span><button onclick="window.deleteGoal('${g.id}')" class="text-slate-500 hover:text-red-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div>
                    <div class="w-full bg-slate-900 rounded-full h-2"><div class="vbuck-bg h-2 rounded-full" style="width: ${p}%"></div></div>
                    <div class="flex justify-between text-[10px] text-slate-400"><span>${p}%</span><span>${g.targetAmount}</span></div>
                    <button onclick="window.claimGoal('${g.id}', ${g.targetAmount})" class="w-full vbuck-bg py-1.5 rounded-lg text-xs font-bold mt-1">Reclamar</button>
                </div>` 
            }).join(''); lucide.createIcons();
        };

        window.renderStore = () => { 
            document.getElementById('store-list').innerHTML = storeData.map(s => `
                <div class="bg-slate-800/40 p-3 rounded-2xl border border-slate-700/50 flex justify-between items-center text-sm">
                    <div class="flex items-center gap-3">
                        <div class="relative w-8 h-8 flex items-center justify-center">
                            <svg class="w-8 h-8 -rotate-90"><circle cx="16" cy="16" r="12" stroke="currentColor" stroke-width="3" fill="transparent" class="text-slate-700"/><circle cx="16" cy="16" r="12" stroke="currentColor" stroke-width="3" fill="transparent" class="text-sky-400" stroke-dasharray="75.4" stroke-dashoffset="0" data-circle-end="${s.endDate}"/></svg>
                        </div>
                        <span class="font-bold text-slate-200">${s.name}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-sky-400 font-bold" data-text-end="${s.endDate}">...</span>
                        <button onclick="window.deleteStoreItem('${s.id}')" class="text-slate-500 hover:text-red-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                </div>
            `).join(''); lucide.createIcons();
        };

        window.renderHabits = () => { 
            const today = new Date().toISOString().split('T')[0]; 
            document.getElementById('habits-list').innerHTML = habitsData.map(h => `<label class="flex items-center gap-3 p-3 rounded-2xl bg-slate-800/40 border border-slate-700/50"><input type="checkbox" onchange="window.toggleHabit('${h.id}', this.checked)" ${h.log?.[today] ? 'checked' : ''} class="hidden habit-checkbox"><div class="w-6 h-6 border-2 border-slate-600 rounded-lg flex items-center justify-center"><i data-lucide="check" class="w-4 h-4 text-white opacity-0"></i></div><span class="text-sm font-semibold">${h.emoji} ${h.name}</span></label>`).join(''); 
            lucide.createIcons();
        };

        window.toggleHabit = async (id, checked) => { const today = new Date().toISOString().split('T')[0]; const newList = habitsData.map(h => h.id === id ? {...h, log: {...(h.log||{}), [today]: checked}} : h); await setDoc(doc(db, 'artifacts', appId, 'users', currentUserId, 'habits', 'data'), { list: newList }); };
        window.saveNewHabit = async () => { const name = document.getElementById('input-habit-name').value; const emoji = document.getElementById('input-habit-emoji').value; if(name) { const newList = [...habitsData, {id: Date.now().toString(), name, emoji: emoji||'✨', log: {}}]; await setDoc(doc(db, 'artifacts', appId, 'users', currentUserId, 'habits', 'data'), { list: newList }); window.closeModal('modal-add-habit'); } };
        window.saveNewStore = async () => { const name = document.getElementById('input-store-name').value; const date = document.getElementById('input-store-date').value; if(name && date) { await addDoc(collection(db, 'artifacts', appId, 'users', currentUserId, 'storeItems'), { name, endDate: date }); window.closeModal('modal-add-store'); } };
        window.renderCalendar = () => { const grid = document.getElementById('calendar-grid'); grid.innerHTML = ''; const days = new Date(currentCalendarDate.getFullYear(), currentCalendarDate.getMonth() + 1, 0).getDate(); document.getElementById('calendar-month-year').textContent = currentCalendarDate.toLocaleDateString('es', { month: 'long', year: 'numeric' }); for(let i = 1; i <= days; i++) { const d = new Date(currentCalendarDate.getFullYear(), currentCalendarDate.getMonth(), i); const today = new Date(); today.setHours(0,0,0,0); const diff = d >= today ? Math.max(0, (d - today) / 86400000) : 0; grid.innerHTML += `<div class="p-2 bg-slate-800 rounded-xl text-[10px] ${d.getTime() === today.getTime() ? 'border border-sky-500' : ''}">${i}<br><span class="vbuck-color">${currentBalance + (diff * 100)}</span></div>`; } };
        window.changeMonth = (d) => { currentCalendarDate.setMonth(currentCalendarDate.getMonth() + d); window.renderCalendar(); };
        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');
        window.openGoalModal = () => document.getElementById('modal-add-goal').classList.remove('hidden');
        window.handleLogin = () => signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-password').value).catch(e => alert(e.message));
        window.handleRegister = () => createUserWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-password').value).catch(e => alert(e.message));
        window.logout = () => signOut(auth);

        setInterval(() => {
            const now = new Date(); const target = new Date(now); target.setHours(19, 0, 0, 0); if(now > target) target.setDate(target.getDate() + 1);
            const diff = target - now;
            document.getElementById('timer-days').textContent = String(Math.floor(diff / 86400000)).padStart(2, '0');
            document.getElementById('timer-hours').textContent = String(Math.floor((diff % 86400000) / 3600000)).padStart(2, '0');
            document.getElementById('timer-mins').textContent = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
            document.getElementById('timer-secs').textContent = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
            
            document.querySelectorAll('[data-circle-end]').forEach(c => {
                const end = new Date(c.dataset.circleEnd); end.setHours(18, 59, 0, 0);
                const d2 = end - now;
                const p = d2 > 0 ? Math.min(100, (d2 / 86400000) * 100) : 0;
                c.style.strokeDashoffset = 75.4 - (75.4 * p / 100);
            });
            document.querySelectorAll('[data-text-end]').forEach(t => {
                const end = new Date(t.dataset.textEnd); end.setHours(18, 59, 0, 0);
                const d2 = end - now;
                t.textContent = d2 > 0 ? `${Math.ceil(d2/86400000)}d` : "X";
            });
        }, 1000);
        lucide.createIcons();
    </script>
</body>
</html>
